<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout canceled — SafeCart</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f6f7f9; color: #1a1a1a; margin: 0; padding: 64px 24px; text-align: center; }
      .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
      .x { width: 56px; height: 56px; border-radius: 50%; background: #ffe3e3; color: #c92a2a; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; font-weight: 700; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { color: #555; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="x">×</div>
      <h1>Checkout canceled</h1>
      <p>No charges were made. You can close this tab and return to the SafeCart extension.</p>
    </div>
  </body>
</html>
