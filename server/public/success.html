<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment received — SafeCart</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f6f7f9; color: #1a1a1a; margin: 0; padding: 64px 24px; text-align: center; }
      .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
      .check { width: 56px; height: 56px; border-radius: 50%; background: #d3f9d8; color: #2b8a3e; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; font-weight: 700; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { color: #555; line-height: 1.5; }
      .hint { font-size: 13px; color: #888; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check">✓</div>
      <h1>Payment received</h1>
      <p>Thanks for upgrading. SafeCart will refresh your subscription within a few seconds — you can close this tab and return to the extension.</p>
      <p class="hint">If your popup still shows the free tier, open it and click <em>Refresh subscription</em> in Settings.</p>
    </div>
  </body>
</html>
