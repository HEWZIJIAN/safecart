<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta property="og:site_name" content="Test Mart" />
    <title>Order confirmed — Test Mart</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 16px; text-align: center; color: #1a1a1a; }
      .check { width: 56px; height: 56px; border-radius: 50%; background: #d3f9d8; color: #2b8a3e; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; font-weight: 700; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      .order-id { color: #888; font-family: ui-monospace, monospace; font-size: 13px; }
      .summary { margin: 24px auto; max-width: 360px; text-align: left; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 18px; }
      .summary .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
      .summary .row.total { border-top: 1px solid #eee; padding-top: 10px; margin-top: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="check">✓</div>
    <h1>Thank you for your order</h1>
    <div class="order-id">Order #TST-20260519-0042</div>

    <div class="summary">
      <div class="row"><span>Subtotal</span><span>$94.50</span></div>
      <div class="row"><span>Shipping</span><span>$5.00</span></div>
      <div class="row total"><span>Order total</span><span>$99.50</span></div>
    </div>

    <p>Your order is confirmed. A receipt has been emailed to you.</p>
  </body>
</html>
